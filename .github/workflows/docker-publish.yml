name: Test and publish Docker image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Run backend and Web tests
        run: python -m unittest discover -s tests -v
      - name: Validate Compose configuration
        run: docker compose config --quiet

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/supply-monitor
    steps:
      - uses: actions/checkout@v6
      - name: Extract release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#V}" >> "$GITHUB_OUTPUT"
      - name: Verify Docker Hub credentials
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository Actions secrets."
            exit 1
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=sha
      - name: Build and push amd64 and arm64 images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
          provenance: true
          sbom: true
      - name: Generate ready-to-use Docker Hub Compose file
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: python scripts/render_hub_compose.py "$IMAGE:$IMAGE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: docker-compose-deployment
          path: dist/compose.hub.yaml
          if-no-files-found: error
