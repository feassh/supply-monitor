[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-watch"
version = "0.1.0"
description = "可扩展的采购公告采集与关键词通知后端"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5", "Flask>=3.1,<4", "cryptography>=44", "waitress>=3.0,<4"]

[project.scripts]
procurement-watch = "procurement_watch.cli:main"

[tool.setuptools.packages.find]
include = ["procurement_watch*"]

[tool.setuptools.package-data]
procurement_watch = ["templates/*.html", "static/*.css", "static/*.js"]
