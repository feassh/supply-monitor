name: supply-monitor

services:
  app:
    image: supply-monitor:local
    build: .
    ports:
      - "8000:8000"
    volumes:
      - monitor-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 120s
    security_opt:
      - no-new-privileges:true

volumes:
  monitor-data:
